[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proctree"
version = "0.1.0"
description = "Pure-function library for building, querying, and rendering process trees"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "patriciam86" }]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
